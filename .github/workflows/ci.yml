# CI for one official plugin repository. No secrets are used; pull requests from forks are safe to run.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PLUGIN_ID: tmdb
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race -count=1 ./... # includes the SDK conformance suite (conformance_test.go)
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.14.0 }
      - name: Version bump check
        run: bash .github/scripts/versioncheck.sh
      - name: English only
        run: go run ./.github/scripts/english

# CI for one official plugin repository. No secrets are used; pull requests from forks are safe to run.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PLUGIN_ID: tmdb
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race -count=1 ./... # includes the SDK conformance suite (conformance_test.go)
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with: { version: v2.14.0 }
      - name: Version bump check
        run: ./.github/scripts/versioncheck.sh
      - name: English only
        run: go run ./.github/scripts/english
